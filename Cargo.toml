[package]
name = "viscous"
version = "0.1.0"
edition = "2024"
description = "A keyboard-driven TUI for controlling a VISCA PTZ camera over serial or TCP"
license = "0BSD"

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
grafton-visca = { version = "1.0.0", features = ["transport-serial"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"

[dev-dependencies]
grafton-visca = { version = "1.0.0", features = ["test-utils"] }
serialport = "4.9.0"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["term"] }
