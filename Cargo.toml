[workspace]
members = ["egui_gui"]

[package]
name = "viscous"
version = "0.1.0"
edition = "2024"
description = "Control a VISCA PTZ camera over serial or TCP, by window, terminal or game controller"
license = "0BSD"

# What gets shipped is an executable copied onto a Windows machine by hand, so
# its size is something the user carries. None of this costs anything the app
# can feel: a frame of the GUI is laid out and tessellated in about 80µs, which
# `opt-level = "s"` moves by 4µs against a 16ms budget — the work per frame is
# a few hundred shapes, and no amount of vectorising them matters.
#
# `panic = "abort"` is the one with a behavioural edge: a panic anywhere, the
# camera worker thread included, now takes the process down instead of quietly
# leaving a front end talking to a thread that has gone. That is the better of
# the two, and it happens to be worth ~900KB of unwinding tables.
[profile.release]
opt-level = "s"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

# The terminal front end. `viscous` itself is the GUI, built from `egui_gui/`
# and named there; this is the one to reach for where there is no display —
# over ssh, on a headless box, or beside a camera on a machine that never grew
# a desktop.
[[bin]]
name = "viscous-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
grafton-visca = { version = "1.0.0", features = ["transport-serial"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"

[dev-dependencies]
grafton-visca = { version = "1.0.0", features = ["test-utils"] }
serialport = "4.9.0"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", features = ["term"] }
