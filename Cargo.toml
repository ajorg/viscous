[package]
name = "viscous"
version = "0.1.0"
edition = "2024"
description = "A keyboard-driven TUI for controlling a VISCA PTZ camera over serial"
license = "0BSD"

[dependencies]
directories = "6.0.0"
grafton-visca = { version = "1.0.0", features = ["transport-serial"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"

[dev-dependencies]
grafton-visca = { version = "1.0.0", features = ["test-utils"] }
