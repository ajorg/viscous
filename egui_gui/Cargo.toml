[package]
name = "egui_gui"
version = "0.1.0"
edition = "2024"

# The program, under the name it is known by. The package is still named for
# the toolkit it happens to be built with, which is a fact about this directory
# and not about what gets copied onto a machine.
#
# Its terminal counterpart is `viscous-tui`, built from the crate above. Two
# files rather than one flag, because a Windows executable chooses its
# subsystem when it is linked and the two front ends want opposite answers: the
# GUI is linked for the windows subsystem so that no console box trails it
# around, and the TUI needs a real console to read keys from in raw mode.
[[bin]]
name = "viscous"
path = "src/main.rs"

[dependencies]
# eframe's default renderer is wgpu, which brings a whole graphics stack with
# it — Vulkan, D3D12, Metal and the naga shader compiler — to draw what this
# window draws: flat triangles and text. `glow` talks to OpenGL directly and
# costs about a quarter of the binary less. What it asks of the machine is
# OpenGL 3.3, which any Windows box with its graphics driver installed has;
# wgpu is the fallback if one ever turns out not to (restore the default
# features, and drop the parameter from `App::on_exit`).
#
# `accesskit` stays: the hand-painted pad and rockers are built to report
# themselves to a screen reader, and that is what carries it.
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.35.0"
gilrs = "0.11.2"
grafton-visca = { version = "1.0.0", features = ["transport-serial"] }
viscous = { version = "0.1.0", path = ".." }

[build-dependencies]
ico = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
winresource = "0.1.31"

[dev-dependencies]
egui_kittest = "0.35.0"
